name: Build tools validation
on:
  push:
    branches: ['feature/**', 'integration/**']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m compileall -q scripts
      - run: python3 scripts/build/validate_data.py
      - run: python3 -m unittest discover -s scripts/build -p 'test_*.py'
